[project]
name = "copa-chalkboard"
version = "0.1.0"
description = "Copa Chalkboard — a beginner Codelab: a two-agent tactical-analysis system (Match Scout -> Tactical Analyst) with an in-process A2A handoff and a validation gate, built on Gemini + Google ADK."
readme = "README.md"
# 3.10+ keeps the Codelab inclusive; 3.13 recommended to match the
# GoogleCloudPlatform/race-condition reference architecture.
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "google-genai>=1.0.0",
    "pydantic>=2.6",
    "requests>=2.31",
]

[project.optional-dependencies]
# ADK is the teaching centerpiece (in-process A2A via AgentTool/SequentialAgent).
# It is optional so the pure-Python pipeline and the test suite run with zero
# extra setup; install it to run the ADK-native pipeline.
adk = ["google-adk>=1.0.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[project.scripts]
copa-chalkboard = "copa_chalkboard.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["copa_chalkboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
